name: Apply audit payload

on:
  push:
    branches: ["ai/deep-audit-round-2"]
    paths:
      - ".audit/apply-patch.sh"

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[audit-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply reviewed patch
        run: bash .audit/apply-patch.sh
      - name: Verify source structure
        run: |
          python3 verify_structure.py
          python3 verify_math.py
          git diff --check
      - name: Commit applied source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply comprehensive audit fixes [audit-applied]"
          git push

name: CI

on:
  push:
    branches: [main, "ai/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust ${{ matrix.toolchain }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.70.0", stable]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - name: Check
        run: cargo check --all-targets
      - name: Test
        run: cargo test --all-targets
      - name: Self-test
        if: matrix.toolchain == 'stable'
        run: cargo run --release -- selftest --threads 2
      - name: Verify independent math
        if: matrix.toolchain == 'stable'
        run: python3 verify_math.py
      - name: Verify source structure
        if: matrix.toolchain == 'stable'
        run: python3 verify_structure.py

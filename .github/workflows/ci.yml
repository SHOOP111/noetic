name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (Rust ${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.70.0", stable]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - name: Check
        run: |
          cargo check --all-targets || {
            echo "::error::Cargo check failed"
            exit 1
          }
      - name: Test
        run: cargo test --all-targets

  selftest:
    name: Engine self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo run --release -- selftest --threads 2

  verify:
    name: Independent verifiers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify math
        run: python3 verify_math.py
      - name: Verify source structure
        run: python3 verify_structure.py

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (Rust ${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.70.0", stable]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - name: Check
        id: check_step
        run: cargo check --all-targets
      - name: Capture error log
        if: failure() && matrix.toolchain == 'stable'
        run: |
          cargo check --all-targets 2>&1 > compiler_error.txt || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B ai/build-diagnostics
          git add compiler_error.txt
          git commit -m "diagnostics: compiler error log [skip ci]"
          git push -f origin ai/build-diagnostics
      - name: Test
        run: cargo test --all-targets

  selftest:
    name: Engine self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo run --release -- selftest --threads 2

  verify:
    name: Independent verifiers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify math
        run: python3 verify_math.py
      - name: Verify source structure
        run: python3 verify_structure.py

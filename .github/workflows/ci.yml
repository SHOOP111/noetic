name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Format and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  build:
    name: Build and test (Rust ${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.70.0", stable]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - name: Check
        run: cargo check --all-targets 2>&1 | tee /tmp/cargo_check.log
      - name: Post check failure log
        if: failure() && matrix.toolchain == 'stable'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try {
              log = fs.readFileSync('/tmp/cargo_check.log', 'utf8');
            } catch (e) {
              log = String(e);
            }
            if (context.issue.number) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: '### Cargo Check Failure (' + '${{ matrix.toolchain }}' + '):\n```\n' + log.slice(-60000) + '\n```'
              });
            }
      - name: Test
        run: cargo test --all-targets 2>&1 | tee /tmp/cargo_test.log
      - name: Post test failure log
        if: failure() && matrix.toolchain == 'stable'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try {
              log = fs.readFileSync('/tmp/cargo_test.log', 'utf8');
            } catch (e) {
              log = String(e);
            }
            if (context.issue.number) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: '### Cargo Test Failure (' + '${{ matrix.toolchain }}' + '):\n```\n' + log.slice(-60000) + '\n```'
              });
            }

  selftest:
    name: Engine self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run selftest
        run: cargo run --release -- selftest --threads 2 2>&1 | tee /tmp/selftest.log
      - name: Post selftest failure log
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try {
              log = fs.readFileSync('/tmp/selftest.log', 'utf8');
            } catch (e) {
              log = String(e);
            }
            if (context.issue.number) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: '### Selftest Failure:\n```\n' + log.slice(-60000) + '\n```'
              });
            }

  verify:
    name: Independent verifiers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify source structure
        run: python3 verify_structure.py
      - name: Build release binary
        run: cargo build --release
      - name: Verify the compiled engine end to end
        run: python3 verify_engine.py target/release/noetic
